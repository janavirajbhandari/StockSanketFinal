name: Daily Stock Update

on:
  schedule:
    - cron: '45 3 * * *'  # ⏰ 9:30 AM Nepal time (NPT = UTC+5:45)
  workflow_dispatch:       # manual trigger option



jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert nbformat
          
      - name: Install Google Chrome
        run: |
            sudo apt-get update
            sudo apt-get install -y wget unzip xvfb libxi6 libindicator7
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -fy instll

      - name: Run Daily Update Script
        run: python daily_update.py
