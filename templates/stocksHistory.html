<!-- templates/stocksHistory.html -->
<div id="history-table-wrapper">
    {% include "partials/history_table.html" %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    function bindPaginationLinks() {
        document.querySelectorAll(".history-page-link").forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const page = this.dataset.page;
                const symbol = "{{ stock.symbol }}";

                fetch(`/stock/history_partial/?symbol=${symbol}&page=${page}`)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById("history-table-wrapper").innerHTML = data.html;
                        bindPaginationLinks();  // Re-bind new pagination links
                    })
                    .catch(error => console.error("❌ Pagination error:", error));
            });
        });
    }

    bindPaginationLinks(); // Initial bind
});
</script>
